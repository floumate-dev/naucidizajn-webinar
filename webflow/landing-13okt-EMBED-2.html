    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}

  }
  function splitName(full){
    full = (full || "").trim().replace(/\s+/g," ");
    if (!full) return { first:"", last:"" };
    var p = full.split(" ");
    if (p.length === 1) return { first:p[0], last:"" };

    + '</div>'
    + '</div>';

    + '<button id="ndm-close" type="button" aria-label="Zatvori" style="position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:#fff;font-size:20px;line-height:1;cursor:pointer;">\u00d7</button>'
    + '<div id="ndm-form">'
    + '<div style="font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#DBFF00;">Rezervi\u0161i mesto</div>'

    + '<p style="margin:8px 0 0;font-size:14px;line-height:1.5;color:#D3D3D3;">Javi\u0107emo ti se pred po\u010detak, da ne propusti\u0161 start. Broj koristimo samo za podsetnik.</p>'
    + phoneRowHtml
    + '<div id="ndm-error2" style="display:none;margin-top:14px;font-size:13px;line-height:1.45;color:#FFB4B4;background:rgba(229,72,77,0.12);border:1px solid rgba(229,72,77,0.4);border-radius:8px;padding:10px 12px;"></div>'

    + '</div>';
  var overlay = document.createElement("div");
  overlay.id = "ndm-overlay";
  overlay.setAttribute("style","position:fixed;inset:0;z-index:2147483600;background:rgba(3,4,0,0.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:24px;font-family:'Raptor Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;");
  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  /* A/B test: klik na "Rezervisi mesto" (otvaranje forme) -> dashboard. Samo kad je posetilac
     dosao preko /t/ linka (ab=<slug>.<A|B> u linku). Bez licnih podataka: varijanta + nasumican
     broj iz pregledaca. sendBeacon ne ceka odgovor i ne sme da ometa formu. */
  var AB_KLIK_URL = "https://naucidizajn-dashboard.vercel.app/t/";
  function ndAbKlik(){
    try {
      var ab = (new URLSearchParams(window.location.search).get("ab") || "").trim();
      var m = ab.match(/^([a-z0-9][a-z0-9-]{0,59})\.(A|B)$/i);
      if (!m || !navigator.sendBeacon) return;
      var vid = "";
      try { vid = localStorage.getItem("nd_vid") || ""; } catch(_){}
      if (!/^[A-Za-z0-9_-]{8,64}$/.test(vid)) {
        vid = Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
        try { localStorage.setItem("nd_vid", vid); } catch(_){}
      }
      navigator.sendBeacon(AB_KLIK_URL + m[1].toLowerCase() + "/klik", JSON.stringify({ v: m[2].toUpperCase(), vid: vid }));
    } catch(_){}
  }
  function openM(e){
    if(e) e.preventDefault();
    ndAbKlik();

    if (typeof stage !== "undefined" && stage !== "form") showStage(stage);

  }
  function closeM(){ overlay.style.display="none"; document.documentElement.style.overflow=""; }

  document.getElementById("ndm-close").addEventListener("click", closeM);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeM(); });

  var ime=document.getElementById("ndm-ime"), email=document.getElementById("ndm-email"), tel=document.getElementById("ndm-telefon"), country=document.getElementById("ndm-country");

  var phoneOk=document.getElementById("ndm-phone-ok"), phoneSkip=document.getElementById("ndm-phone-skip"), errBox2=document.getElementById("ndm-error2");

  /* email: tacno jedan @, domen sa tackom, bez razmaka (05.10: "x@gmail.com@gmail.com" je prolazio) */
  function vEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()); }
  /* ceste greske u domenu -> predlog ispravke (u bazi ~20 takvih: gmail.con, gnail.com...) */
  var EMAIL_TYPOS = {
    "gmail.con":"gmail.com","gmail.co":"gmail.com","gmail.cm":"gmail.com","gmail.om":"gmail.com","gmail.comm":"gmail.com",
    "gmial.com":"gmail.com","gmai.com":"gmail.com","gmal.com":"gmail.com","gmali.com":"gmail.com","gnail.com":"gmail.com","gmaill.com":"gmail.com",
    "hotmai.com":"hotmail.com","hotmial.com":"hotmail.com","hotmail.con":"hotmail.com",
    "yahoo.con":"yahoo.com","yahoo.como":"yahoo.com","yaho.com":"yahoo.com",
    "outlok.com":"outlook.com","outlook.con":"outlook.com","icloud.con":"icloud.com","icould.com":"icloud.com"
  };
  function emailFix(v){
    v=String(v).trim().toLowerCase(); var at=v.lastIndexOf("@"); if(at<1) return "";
    var dom=v.slice(at+1), fixed=EMAIL_TYPOS[dom] || (/\.con$/.test(dom) ? dom.replace(/\.con$/,".com") : "");
    return fixed ? v.slice(0,at+1)+fixed : "";
  }
  function vPhone(v){ return String(v).replace(/\D/g,"").length >= 6; } // labavo: bar 6 cifara

  /* telefon -> E.164 preko izabranog pozivnog broja.
     05.10: iPhone automatsko popunjavanje ubaci nevidljive znakove ispred "+381...", pa je
     ispred dodavan jos jedan pozivni broj ("+381+381..."). Zato: prvo samo cifre i "+",
     pa poslednji "+" pobedjuje; broj koji vec pocinje pozivnim brojem bez "+" ga ne dobija opet. */
  function buildPhone(dialCode, raw){
    var s=String(raw||"").replace(/[^\d+]/g,"");
    if(!s.replace(/\+/g,"")) return "";
    var lastPlus=s.lastIndexOf("+");
    if(lastPlus>-1) return "+"+s.slice(lastPlus+1).replace(/\D/g,"");
    if(s.indexOf("00")===0) return "+"+s.slice(2);
    var dc=String(dialCode||"+381").replace(/\D/g,"");
    if(s.indexOf(dc)===0 && s.length>=dc.length+8) return "+"+s;
    return "+"+dc+s.replace(/^0+/,"");
  }

    HR:'91 1234567', RS:'60 1234567', BA:'61 234 567', ME:'67 123 456',
    SI:'31 234 567', MK:'70 123 456', AL:'66 123 4567',
    AU:'412 345 678', AT:'660 1234567', BE:'470 12 34 56', BR:'11 91234 5678',
    BG:'87 123 4567', CZ:'601 123 456', DK:'20 12 34 56', EG:'100 123 4567',
    PH:'905 123 4567', FI:'40 1234567', FR:'6 12 34 56 78', GR:'691 234 5678',
    IN:'81234 56789', ID:'812 3456 789', IE:'85 012 3456', IT:'312 345 6789',
    IL:'50 123 4567', JP:'90 1234 5678', ZA:'71 123 4567', CA:'506 234 5678',
    CN:'131 2345 6789', HU:'20 123 4567', MY:'12 345 6789', MX:'55 1234 5678',
    NL:'6 12345678', NO:'406 12 345', DE:'1512 3456789', PL:'512 345 678',
    PT:'912 345 678', RO:'712 345 678', RU:'912 345 6789', US:'201 555 0123',
    SA:'50 123 4567', SG:'8123 4567', SK:'912 123 456', ES:'612 34 56 78',
    SE:'70 123 45 67', CH:'78 123 45 67', TH:'81 234 5678', TR:'501 234 5678',
    AE:'50 123 4567', UA:'50 123 4567', GB:'7400 123456', VN:'912 345 678'
  };
  function selectedCc(){ var opt=country?country.options[country.selectedIndex]:null; return opt?opt.getAttribute("data-country"):null; }
  function setPhonePlaceholder(){
    if(!country||!tel) return;
    var cc=selectedCc();
    tel.placeholder=(cc&&PHONE_PLACEHOLDERS[cc])||"6x xxx xxxx";
    refreshCcBtn();
  }
  function applyCountryCode(code){
    if(!code||!country) return false;
    code=String(code).trim().toUpperCase();
    if(!/^[A-Z]{2}$/.test(code)) return false;
    var opt=country.querySelector('option[data-country="'+code+'"]');
    // samo selected (ne country.value): +1 imaju i Kanada i SAD, value bi uvek izabrao prvu
    if(opt){ opt.selected=true; setPhonePlaceholder(); return true; }
    return false;
  }

  /* izbor drzave: dugme (zastava + pozivni) otvara listu ispod polja, sa pretragom */
  var ccBtn=document.getElementById("ndm-cc-btn"), ccPanel=document.getElementById("ndm-cc-panel"),
      ccSearch=document.getElementById("ndm-cc-search"), ccList=document.getElementById("ndm-cc-list");
  function refreshCcBtn(){
    if(!ccBtn||!country) return;
    var opt=country.options[country.selectedIndex], cc=selectedCc();
    ccBtn.innerHTML=(cc?flagImg(cc):"")+'<span>'+(opt?opt.value:"")+'</span><span class="ndm-cc-caret" aria-hidden="true"></span>';
    [].forEach.call(ccList.querySelectorAll(".ndm-cc-item"), function(b){ b.classList.toggle("is-sel", b.getAttribute("data-country")===cc); });
  }
  function ccFilter(q){
    q=String(q||"").trim().toLowerCase();
    [].forEach.call(ccList.querySelectorAll(".ndm-cc-item"), function(b){ b.style.display = !q || b.getAttribute("data-search").indexOf(q)>-1 ? "" : "none"; });
    [].forEach.call(ccList.querySelectorAll(".ndm-cc-group"), function(g){ g.style.display = q ? "none" : ""; });
  }
  function ccOpen(open){
    ccPanel.classList.toggle("is-open", open);
    ccBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if(open){
      ccSearch.value=""; ccFilter("");
      var sel=ccList.querySelector(".ndm-cc-item.is-sel"); ccList.scrollTop=0; if(sel) ccList.scrollTop = Math.max(0, sel.getBoundingClientRect().top - ccList.getBoundingClientRect().top - 40);
      // na telefonu bez automatskog fokusa (ne iskace tastatura preko liste)
      if(window.matchMedia && window.matchMedia("(hover:hover)").matches) ccSearch.focus();
    }
  }
  if(ccBtn && ccPanel){
    ccBtn.addEventListener("click", function(){ ccOpen(!ccPanel.classList.contains("is-open")); });
    ccSearch.addEventListener("input", function(){ ccFilter(ccSearch.value); });
    ccList.addEventListener("click", function(e){
      var b=e.target.closest ? e.target.closest(".ndm-cc-item") : null; if(!b) return;
      applyCountryCode(b.getAttribute("data-country")); ccOpen(false); tel.focus();
    });
    ccPanel.addEventListener("keydown", function(e){ if(e.key==="Escape"){ e.stopPropagation(); ccOpen(false); ccBtn.focus(); } });
    document.addEventListener("click", function(e){ if(ccPanel.classList.contains("is-open") && !ccPanel.contains(e.target) && !ccBtn.contains(e.target)) ccOpen(false); });
  }
  if(country){
    country.addEventListener("change", setPhonePlaceholder);
    setPhonePlaceholder();
    if(typeof fetch==="function"){
      var geoTimeout=function(){ return (window.AbortSignal&&AbortSignal.timeout)?AbortSignal.timeout(2500):undefined; };
      var GEO=[
        function(){ return fetch("https://get.geojs.io/v1/ip/country.json",{signal:geoTimeout()}).then(function(r){return r.ok?r.json():null;}).then(function(j){return j&&j.country;}); },
        function(){ return fetch("https://ipwho.is/?fields=country_code",{signal:geoTimeout()}).then(function(r){return r.ok?r.json():null;}).then(function(j){return j&&j.country_code;}); },
        function(){ return fetch("https://ipapi.co/country/",{signal:geoTimeout()}).then(function(r){return r.ok?r.text():null;}); }
      ];
      (function tryGeo(i){ if(i>=GEO.length) return; GEO[i]().then(function(c){ if(!applyCountryCode(c)) tryGeo(i+1); }).catch(function(){ tryGeo(i+1); }); })(0);
    }
  }

  /* Vokativ (srpski) \u2014 inline, identi\u010dno tibor-vokativ.vercel.app/api/vokativ.
     Bezbedno: jasni (uglavnom mu\u0161ki) vokativi; \u017eensko/strano/nesigurno -> nominativ. */
  var VOK_DICT = {
    'petar':'Petre','aleksandar':'Aleksandre','vuk':'Vuk','novak':'Novak','tarik':'Tarik','faruk':'Faruk',
    'daniel':'Daniel','gabriel':'Gabriel','mihael':'Mihael','rafael':'Rafael','samuel':'Samuel','manuel':'Manuel','noel':'Noel',
    'kevin':'Kevin','brajan':'Brajan','dilan':'Dilan','denis':'Denis',
    'ines':'Ines','nives':'Nives','karmen':'Karmen','doris':'Doris','iris':'Iris','ingrid':'Ingrid',
    'dolores':'Dolores','nikol':'Nikol','merjem':'Merjem'
  };
  function vokativ(raw){
    if(!raw) return "";
    var nm = String(raw).trim().split(/\s+/)[0];
    if(!nm) return "";
    nm = nm.charAt(0).toLocaleUpperCase('sr') + nm.slice(1).toLocaleLowerCase('sr');
    var key = nm.toLocaleLowerCase('sr');
    if(VOK_DICT[key]) return VOK_DICT[key];
    var last = nm.slice(-1).toLowerCase();
    if('aeiou'.indexOf(last)!==-1) return nm;   // samoglasnik -> nominativ
    if('kgh'.indexOf(last)!==-1) return nm;     // -k/-g/-h
    if(last==='j') return nm;                   // -j -> nominativ
    return nm + 'e';                            // ostali suglasnici -> Stefan->Stefane
  }

  function parseAEventError(body,status){
    var msg=""; try{ var j=JSON.parse(body); if(j&&j.error) msg=String(j.error); }catch(e){ msg=body||""; }
    var t=msg.toLowerCase();
    if(t.indexOf("invalid email")!==-1) return "Email nije validan. Proveri unos.";
    if(t.indexOf("webinar not found")!==-1||t.indexOf("no upcoming")!==-1) return "Trenutno nema dostupnog termina. Probaj kasnije ili nas kontaktiraj.";
    if(t.indexOf("already registered")!==-1||t.indexOf("duplicate")!==-1) return "Ve\u0107 si prijavljen sa ovim email-om. Proveri inbox (i promotions/spam).";
    if(t.indexOf("invalid phone")!==-1) return "Broj telefona nije validan. Proveri format.";
    if(t.indexOf("rate limit")!==-1||status===429) return "Previ\u0161e poku\u0161aja. Sa\u010dekaj minut pa probaj ponovo.";
    if(status===0) return "Nema konekcije. Proveri internet pa probaj ponovo.";
    if(msg&&msg.length<200) return "Gre\u0161ka: "+msg;
    return "Do\u0161lo je do gre\u0161ke ("+status+"). Poku\u0161aj ponovo.";
  }

  var submitted = false;    // guard protiv duplog slanja koraka 1
  var mkBase = null;        // payload koraka 1 (isti event_id i email idu i u korak 2)
  var aeventPending = false; // AEvent je trazio telefon -> registracija se zavrsava u koraku 2
  var emailVal = "", fullName = "", ref = "", trk = {};

  function sendMake(payload){
    try { fetch(MAKE_WEBHOOK, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload), keepalive:true }).catch(function(){}); } catch(_){}
  }

  /* success + redirect na thank-you (DRY) */
  function ndGoThankYou(){
    showStage("done");
    var hq = new URLSearchParams();
    hq.set("email", emailVal);
    if(fullName) hq.set("name", fullName);
    if(ref) hq.set("ref", ref);
    var sep = THANKYOU_URL.indexOf("?") > -1 ? "&" : "?";
    setTimeout(function(){ window.location.href = THANKYOU_URL + sep + hq.toString(); }, 700);
  }

  /* AEvent API registracija (awaited): attendance tracking; AEvent dodeli sesiju (secret+wtl).
     phone je prazan u koraku 1 (ne salje se); onOk/onErr dobijaju telo greske. */
  function registerAEvent(phone, onOk, onErr){
    var aeBody = new URLSearchParams();
    aeBody.append("secret", AEVENT.SECRET);
    aeBody.append("wtl", AEVENT.WTL);
    aeBody.append("name", fullName);
    aeBody.append("email", emailVal);
    if (phone) aeBody.append("phone", phone);
    for (var aek in trk) { if (Object.prototype.hasOwnProperty.call(trk, aek)) aeBody.append(aek, String(trk[aek])); }
    if(ref) aeBody.append("ref", ref);
    var ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    var tid = ctrl ? setTimeout(function(){ ctrl.abort(); }, 15000) : null;
    fetch(AEVENT.ENDPOINT, {
      method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body:aeBody.toString(),
      signal: ctrl ? ctrl.signal : undefined
    })
    .then(function(res){ if(tid) clearTimeout(tid); return res.text().then(function(b){ return { ok:res.ok, status:res.status, body:b }; }); })
    .then(function(r){ if(r.ok) onOk(); else onErr(r.body, r.status, null); })
    .catch(function(err){ if(tid) clearTimeout(tid); onErr("", 0, err); });
  }
  function networkMsg(err){ return err && err.name==="AbortError" ? "Mre\u017ea je prespora. Poku\u0161aj ponovo." : "Gre\u0161ka pri prijavi. Proveri vezu pa probaj ponovo."; }
  var aeventOn = !!AEVENT.SECRET && AEVENT.SECRET.indexOf("PASTE_") !== 0;

  /* ===== KORAK 1: ime + email ===== */
  submitBtn.addEventListener("click", function(e){
    e.preventDefault();
    if (submitted) return;
    clearError();
    var ok=true; reset(ime); reset(email);
    if(!ime.value.trim()){ ime.style.borderColor="#E5484D"; ok=false; }
    if(!vEmail(email.value)){ email.style.borderColor="#E5484D"; ok=false; }
    if(!ok){ showError("Proveri unos \u2014 ime i ispravan email su obavezni."); return; }
    var fix = emailFix(email.value);
    if(fix){
      email.style.borderColor="#E5484D";
      showError("Da li si mislio " + fix + "? Ispravi email pa klikni ponovo.");
      email.value = fix; // ispravljeno u polju, drugi klik salje
      return;
    }

    emailVal = email.value.trim().toLowerCase();
    fullName = ime.value.trim().replace(/\s+/g," ");
    var sp = splitName(fullName);
    trk = getTrk();
    ref = getRef();

    submitted = true;
    setLoading(true);

    /* hand-off za thank-you referral widget (backup uz URL params na redirectu) */
    try {
      sessionStorage.setItem("nd_signup", JSON.stringify({ email: emailVal, name: fullName, ref: ref, ts: Date.now() }));
    } catch(_){}

    /* 1) Make webhook, step "prijava": Kit, GHL, Sheets, CAPI, dashboard. Uvek svi kljucevi (i prazan phone). */
    mkBase = { webinar:WEBINAR_ID, step:"prijava", name:fullName, first_name:sp.first, last_name:sp.last, vokativ:vokativ(sp.first),
               email:emailVal, phone:"", ref:ref,
               /* Meta CAPI (server-side Lead preko Make HTTP modula). fbc/fbp/UA/URL idu PLAIN,
                  Make heshuje email/ime. event_time u UNIX SEKUNDAMA (ne ISO). */
               event_id: newEventId(),
               event_time: Math.floor(Date.now()/1000),
               event_source_url: window.location.href,
               client_user_agent: navigator.userAgent,
               fbc: getFbc(),
               fbp: getFbp() };
    for (var mkk in trk) { if (Object.prototype.hasOwnProperty.call(trk, mkk)) mkBase[mkk] = String(trk[mkk]); }
    sendMake(mkBase);

    if (!aeventOn) { showStage("phone"); return; }

    /* 2) AEvent bez telefona -> korak 2 */
    registerAEvent("", function(){ setLoading(false); showStage("phone"); }, function(body, status, err){
      if (!err && /phone/i.test(body || "") && !/invalid phone/i.test(body || "")) {
        // AEvent trazi telefon: registracija se zavrsava u koraku 2, bez "Preskoci"
        aeventPending = true; phoneSkip.style.display = "none";
        setLoading(false); showStage("phone"); return;
      }
      submitted = false; setLoading(false);
      showError(err ? networkMsg(err) : parseAEventError(body, status));
    });
  });

  /* ===== KORAK 2: telefon ===== */
  var phoneSent = false;
  function setPhoneLoading(on){
    phoneOk.style.pointerEvents = on ? "none" : ""; phoneOk.style.opacity = on ? "0.85" : "";
    phoneOk.innerHTML = on ? "\u0160aljem\u2026" : 'Potvrdi <span>\u2192</span>';
    phoneSkip.style.pointerEvents = on ? "none" : "";
  }
  phoneOk.addEventListener("click", function(e){
    e.preventDefault();
    if (phoneSent) return;
    clearError2(); resetRow();
    if(!vPhone(tel.value)){ if(phoneRow) phoneRow.style.borderColor="#E5484D"; showError2("Upi\u0161i broj telefona (WhatsApp)."); return; }
    var phoneE164 = buildPhone(country ? country.value : "+381", tel.value);
    phoneSent = true; setPhoneLoading(true);
    /* samo telefon: u Make-u ide na rutu "Telefon" (GHL + Sheets), ne u CAPI/dashboard/Kit */
    var mk = {}; for (var k in mkBase) { if (Object.prototype.hasOwnProperty.call(mkBase, k)) mk[k] = mkBase[k]; }
    mk.step = "telefon"; mk.phone = phoneE164;
    sendMake(mk);
    if (!aeventPending) { ndGoThankYou(); return; }
    registerAEvent(phoneE164, function(){ ndGoThankYou(); }, function(body, status, err){
      phoneSent = false; setPhoneLoading(false);
      showError2(err ? networkMsg(err) : parseAEventError(body, status));
    });
  });
  phoneSkip.addEventListener("click", function(e){
    e.preventDefault();
    if (phoneSent || aeventPending) return;
    ndGoThankYou();
  });
})();

/* ===== countdown ===== */
(function(){
  var target = new Date("2026-10-13T19:00:00+02:00").getTime(); // Beograd vreme (UTC+2 u oktobru, letnje do 25.10.)
  var el = {
    days: document.querySelector("[data-days]"),
    hours: document.querySelector("[data-hours]"),
    mins: document.querySelector("[data-mins]"),
    secs: document.querySelector("[data-secs]")
  };
  function pad(n){ return String(n).padStart(2,"0"); }
  function tick(){
    var now = Date.now();
    if (target <= now) { var cd=document.getElementById("countdown"); if(cd) cd.style.display="none"; return; }
    var diff = target - now;
    var S=1000, M=60*S, H=60*M, D=24*H;
    var days=Math.floor(diff/D); diff-=days*D;
    var hours=Math.floor(diff/H); diff-=hours*H;
    var mins=Math.floor(diff/M); diff-=mins*M;
    var secs=Math.floor(diff/S);
    el.days.textContent=pad(days);
    el.hours.textContent=pad(hours);
    el.mins.textContent=pad(mins);
    el.secs.textContent=pad(secs);
  }
  tick(); setInterval(tick, 1000);
})();
</script>
